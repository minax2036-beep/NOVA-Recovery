name: Build NOVA Core

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --parallel 2
      - name: Run host tests
        run: ctest --test-dir build --output-on-failure
      - name: Generate UI preview
        run: ./build/nova-core
      - name: Generate boot splash preview
        run: ./build/nova-recovery-boot-sim
      - name: Upload preview images
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-host-previews
          path: |
            build/test.img
            build/boot-preview.ppm
          if-no-files-found: error
          retention-days: 14
