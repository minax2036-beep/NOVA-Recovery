name: Build NOVA Core

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --parallel 2
      - name: Run host tests
        run: ctest --test-dir build --output-on-failure
      - name: Run diagnostic demo and generate test.img
        run: ./build/nova-core
      - name: Upload test image
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-test-img
          path: build/test.img
          if-no-files-found: error
          retention-days: 14
